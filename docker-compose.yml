version: '3.8'

services:
  sshadmin:
    build: .
    container_name: sshadmin
    ports:
      - "5000:5000"
      - "2222:2222"
    environment:
      - SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_URL=sqlite:////app/instance/sshadmin.db
    volumes:
      - ./data:/app/instance
      - /etc/ssh:/etc/ssh:ro  # Mount SSH directory for CA keys
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
