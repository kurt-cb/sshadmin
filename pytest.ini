[pytest]
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:flask_sqlalchemy
    ignore::DeprecationWarning:werkzeug
markers =
    lxc: end-to-end tests that require LXC/Incus (run alone: pytest tests/test_lxc_integration.py)
addopts = --cov=sshadmin --cov=ssh_auth_server --cov-report=term-missing --cov-report=html
